<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список ДЗ</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <h2>Общий список ДЗ</h2>

  <div class="input-group">
    <input type="text" id="taskInput" placeholder="Введите задание...">
    <button id="addBtn">Добавить</button>
  </div>

  <ul id="taskList"></ul>

  <!-- Подключаем Firebase SDK через CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"

    // 1. Твои настройки из консоли Firebase
    const firebaseConfig = {
      apiKey: "ТВОЙ_API_KEY",
      authDomain: "ТВОЙ_PROJECT_ID.firebaseapp.com",
      projectId: "ТВОЙ_PROJECT_ID",
      storageBucket: "ТВОЙ_PROJECT_ID.appspot.com",
      messagingSenderId: "ТВОЙ_SENDER_ID",
      appId: "ТВОЙ_APP_ID"
    }

    // Инициализация
    const app = initializeApp(firebaseConfig)
    const db = getFirestore(app)
    const homeworkRef = collection(db, "homework")

    const taskInput = document.getElementById("taskInput")
    const addBtn = document.getElementById("addBtn")
    const taskList = document.getElementById("taskList")

    // 2. Слушаем изменения в реальном времени
    const q = query(homeworkRef, orderBy("createdAt", "desc"))

    onSnapshot(q, (snapshot) => {
      taskList.innerHTML = ""
      snapshot.forEach((doc) => {
        const data = doc.data()
        const li = document.createElement("li")
        li.textContent = data.title
        taskList.appendChild(li)
      })
    })

    // 3. Функция добавления записи
    async function addTask() {
      const title = taskInput.value.trim()
      if (!title) return

      try {
        await addDoc(homeworkRef, {
          title: title,
          createdAt: serverTimestamp()
        })
        taskInput.value = ""
      } catch (e) {
        console.error("Ошибка добавления: ", e)
      }
    }

    addBtn.addEventListener("click", addTask)
    taskInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") addTask()
    })
  </script>
</body>
</html>
