​function getAutoWeekType(date) {
const currentYear = date.getFullYear();
let sept1 = new Date(currentYear, 8, 1);
if (date < sept1) {
sept1 = new Date(currentYear - 1, 8, 1);
}
const diffTime = Math.abs(date - sept1);
const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
const weekNumber = Math.floor(diffDays / 7);
return (weekNumber % 2 === 0) ? 'num' : 'den';
}
​function getEffectiveWeekType(date) {

​function updateLiveTimer() {
const now = new Date();
const dayNum = now.getDay();
​if (dayNum === 0 || dayNum === 6) {
document.getElementById('live-status-card').classList.add('hidden');
return;
}
​const currentMin = now.getHours() * 60 + now.getMinutes();
const weekType = getEffectiveWeekType(now);
const currentSched = getGroupSchedule(activeGroup);
const dayLessons = currentSched[weekType][dayNum] || [];
​const meta = groupsMeta[activeGroup] || { shift: 1 };
const times = shiftTimes[meta.shift];
​const liveCard = document.getElementById('live-status-card');
const statusTitle = document.getElementById('live-status-title');
const statusSub = document.getElementById('live-status-sub');
const timerBadge = document.getElementById('live-timer-badge');
​let activeLesson = null;
let nextLesson = null;
​for (let l of dayLessons) {
const lessonTime = times[l.num];
if (currentMin >= lessonTime.startMin && currentMin <= lessonTime.endMin) {
activeLesson = { ...l, times: lessonTime };
break;
}
if (currentMin < lessonTime.startMin && !nextLesson) {
nextLesson = { ...l, times: lessonTime };
}
}
​if (activeLesson) {
liveCard.classList.remove('hidden');
statusTitle.innerText = ИДЕТ ${activeLesson.num} ПАРА (${activeGroup});
statusSub.innerText = ${activeLesson.subject} (${activeLesson.room});
const remMin = activeLesson.times.endMin - currentMin;
timerBadge.innerText = осталось ${remMin} мин;
} else if (nextLesson) {
const remMin = nextLesson.times.startMin - currentMin;
if (remMin <= 45) {
liveCard.classList.remove('hidden');
statusTitle.innerText = СЛЕДУЮЩАЯ ${nextLesson.num} ПАРА (${activeGroup});
statusSub.innerText = ${nextLesson.subject} (${nextLesson.room});
timerBadge.innerText = через ${remMin} мин;
} else {
liveCard.classList.add('hidden');
}
} else {
liveCard.classList.add('hidden');
}
}

​function formatDayForWA(weekType, dayNum, titleTag) {
const dayName = daysNames[dayNum];
const weekTitle = weekType === 'num' ? 'Числитель' : 'Знаменатель';
​if (dayNum === 0 || dayNum === 6) {
return 📅 *РАСПИСАНИЕ ${activeGroup} (${titleTag})*\n📌 ${dayName}: *Выходной день!* 😴;
}
​const currentSched = getGroupSchedule(activeGroup);
const lessons = currentSched[weekType][dayNum] || [];
const meta = groupsMeta[activeGroup] || { shift: 1 };
const times = shiftTimes[meta.shift];
​let msg = 📅 *РАСПИСАНИЕ ${activeGroup} (${titleTag})*\n📌 *${dayName}* (${weekTitle})\n\n;
​lessons.forEach(l => {
const t = times[l.num];
const teacherStr = l.teacher ?  (${l.teacher}) : '';
msg += *${l.num} пара* (${t.start} - ${t.end}):\n  📘 ${l.subject}${teacherStr}\n  📍 ${l.room}\n\n;
});
​return msg.trim();
}
​function formatFullWeekForWA(weekType) {
const weekTitle = weekType === 'num' ? 'Числитель' : 'Знаменатель';
const currentSched = getGroupSchedule(activeGroup);
let msg = 📅 *РАСПИСАНИЕ ${activeGroup} (${weekTitle})*\n\n;
​for (let day = 1; day <= 5; day++) {
msg += 📌 *${daysNames[day].toUpperCase()}*\n;
const lessons = currentSched[weekType][day] || [];
lessons.forEach(l => {
msg += ${l.num}. ${l.subject} (${l.room})\n;
});
msg += \n;
}
return msg.trim();
}
