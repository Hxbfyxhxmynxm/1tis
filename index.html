<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотека</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p {
            color: #a8a8b3;
            font-size: 16px;
        }

        .actions {
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            color: #0d0e11;
            background-color: #61dafb;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(97, 218, 251, 0.2);
        }

        .btn-upload {
            background-color: #04d361;
            box-shadow: 0 4px 12px rgba(4, 211, 97, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .drive-wrapper {
            width: 100%;
            max-width: 950px;
            height: 650px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #202024;
            border: 1px solid #323238;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 Онлайн Библиотека</h1>
        <p>Читай и скачивай книги прямо с Google Диска</p>
    </header>

    <div class="actions">
        <!-- Вставь сюда ссылку на свою папку Google Диска -->
        <a href="https://drive.google.com/drive/folders/ТВОЙ_ID_ПАПКИ" target="_blank" class="btn btn-upload">
            ➕ Добавить книгу на Диск
        </a>
    </div>

    <div class="drive-wrapper">
        <!-- Вставь сюда ID папки в самом конце ссылки -->
        <iframe src="https://drive.google.com/embeddedfolderview?id=ТВОЙ_ID_ПАПКИ#list"></iframe>
    </div>

</body>
</html>
