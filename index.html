<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание 1ТИС-2-26</title>
    
    <meta name="theme-color" content="#0b0f17">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Подключаем нейросеть для распознавания лиц -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; transition: background 0.3s ease, color 0.3s ease; }
        body.theme-dark { background: #0b0f17; color: #f3f4f6; }
        body.theme-dark .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        body.theme-dark .glass-active { background: rgba(37, 99, 235, 0.25); border-color: rgba(59, 130, 246, 0.6); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen pb-24 flex flex-col justify-between theme-dark" id="body-tag">

    <div>
        <header class="sticky top-0 z-40 glass-card border-b px-4 py-3 shadow-lg">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="bg-blue-600 text-white text-[10px] font-extrabold px-2 py-0.5 rounded-md uppercase tracking-wider">2 смена</span>
                        <h1 class="text-xl font-black tracking-tight">1ТИС-2-26</h1>
                    </div>
                    <p id="current-date-str" class="text-xs opacity-70 mt-0.5">Загрузка...</p>
                </div>
                
                <div class="flex items-center gap-2">
                    <button onclick="openFaceAuthModal()" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-cyan-600/30 text-cyan-300 border border-cyan-500/30 active:scale-95 flex items-center gap-1.5">
                        <i class="fa-solid fa-user-viewfinder text-cyan-400"></i>
                        <span id="user-display-name" class="text-[10px]">Вход по лицу</span>
                    </button>

                    <button onclick="openRoleModal()" class="px-2.5 py-1.5 rounded-xl text-xs font-bold glass-card active:scale-95 flex items-center gap-1.5">
                        <i id="role-icon" class="fa-solid fa-user-graduate text-blue-400"></i>
                        <span id="role-badge" class="text-[10px]">Студент</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-md mx-auto px-4 space-y-4 mt-3">
            <div id="section-schedule" class="space-y-4">
                <nav class="flex space-x-2 overflow-x-auto no-scrollbar py-0.5">
                    <button onclick="setView('today')" id="tab-today" class="tab-btn flex-1 min-w-[85px] py-2 px-2.5 rounded-xl text-xs font-semibold text-center transition flex flex-col items-center gap-0.5 glass-card border border-transparent">
                        <span>Сегодня</span>
                        <span id="today-day-sub" class="text-[9px] opacity-60 font-normal">--</span>
                    </button>
                    <button onclick="setView('tomorrow')" id="tab-tomorrow" class="tab-btn flex-1 min-w-[85px] py-2 px-2.5 rounded-xl text-xs font-semibold text-center transition flex flex-col items-center gap-0.5 glass-card border border-transparent">
                        <span>Завтра</span>
                        <span id="tomorrow-day-sub" class="text-[9px] opacity-60 font-normal">--</span>
                    </button>
                </nav>

                <div id="status-banner" class="glass-card rounded-2xl p-4 flex items-center justify-between border-l-4 border-l-blue-500 shadow-md">
                    <div>
                        <span id="view-badge" class="text-[10px] font-extrabold text-blue-400 uppercase tracking-wider block mb-0.5">СЕГОДНЯ</span>
                        <h2 id="view-title" class="text-lg font-bold">--</h2>
                        <p id="view-subtitle" class="text-xs opacity-70 mt-0.5">--</p>
                    </div>
                </div>

                <div id="lessons-container" class="space-y-3"></div>
            </div>

            <div id="section-classmates" class="hidden space-y-4">
                <div class="glass-card rounded-2xl p-4 border-l-4 border-l-cyan-500 flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-bold">👥 Одноклассники</h2>
                        <p class="text-xs opacity-70">База лиц группы для входа</p>
                    </div>
                    <button id="add-classmate-btn" onclick="openAddClassmateModal()" class="hidden bg-cyan-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold active:scale-95 flex items-center gap-1">
                        <i class="fa-solid fa-user-plus"></i> Добавить
                    </button>
                </div>

                <div id="classmates-container" class="grid grid-cols-1 gap-3"></div>
            </div>
        </main>
    </div>

    <!-- Модалка сканирования лица -->
    <div id="face-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm rounded-3xl p-5 text-center space-y-4">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <h3 class="font-bold text-sm text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-face-viewfinder"></i> Сканер лица
                </h3>
                <button onclick="closeFaceAuthModal()" class="text-lg opacity-60"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <p id="face-status-text" class="text-xs opacity-80">Инициализация нейросети...</p>

            <div class="relative w-64 h-64 mx-auto rounded-3xl overflow-hidden border-2 border-cyan-500/50 bg-black flex items-center justify-center">
                <video id="webcam-video" autoplay muted playsinline class="w-full h-full object-cover"></video>
                <div class="absolute inset-0 border-2 border-cyan-400/30 rounded-3xl pointer-events-none animate-pulse"></div>
            </div>

            <button onclick="scanFaceNow()" id="scan-btn" disabled class="w-full bg-cyan-600 text-white font-bold py-3 rounded-xl text-xs opacity-50 active:scale-95 transition">
                Распознать лицо
            </button>
        </div>
    </div>

    <!-- Модалка роли -->
    <div id="role-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-xs rounded-3xl p-5 space-y-4">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h3 class="font-bold text-base">Выбор роли</h3>
                <button onclick="closeRoleModal()" class="text-lg opacity-60"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-2">
                <button onclick="selectRole('student')" class="w-full text-left p-3 rounded-2xl glass-card flex items-center gap-3">
                    <i class="fa-solid fa-user-graduate text-blue-400 text-lg"></i>
                    <div><div class="font-bold text-xs">Студент</div></div>
                </button>
                <button onclick="promptRolePin('admin')" class="w-full text-left p-3 rounded-2xl glass-card flex items-center gap-3">
                    <i class="fa-solid fa-code text-purple-400 text-lg"></i>
                    <div><div class="font-bold text-xs">Разработчик / Админ</div></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Модалка добавления одногруппника -->
    <div id="classmate-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm rounded-3xl p-5 space-y-4">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h3 class="font-bold text-sm">Добавить одноклассника (с фото лица)</h3>
                <button onclick="closeClassmateModal()" class="text-lg opacity-60"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block opacity-70 mb-1">ФИО / Имя:</label>
                    <input type="text" id="cm-name-input" class="w-full bg-black/30 rounded-xl p-3 border border-white/10 focus:outline-none" placeholder="Иван Иванов">
                </div>
                <div>
                    <label class="block opacity-70 mb-1">Четкое фото лица (для нейросети):</label>
                    <input type="file" id="cm-photo-input" accept="image/*" class="w-full bg-black/30 rounded-xl p-2 border border-white/10">
                </div>
            </div>

            <button onclick="saveClassmate()" class="w-full bg-cyan-600 text-white font-bold py-2.5 rounded-xl text-xs active:scale-95">Сохранить и обработать лицо</button>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 z-40 glass-card border-t py-2 px-4 shadow-2xl">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button onclick="switchTab('schedule')" id="nav-schedule" class="nav-item flex flex-col items-center gap-1 text-blue-400 font-bold">
                <i class="fa-solid fa-calendar-days text-lg"></i>
                <span class="text-[10px]">Уроки</span>
            </button>
            <button onclick="switchTab('classmates')" id="nav-classmates" class="nav-item flex flex-col items-center gap-1 opacity-60">
                <i class="fa-solid fa-users text-lg"></i>
                <span class="text-[10px]">Группа</span>
            </button>
        </div>
    </nav>

    <div id="toast" class="fixed bottom-16 left-1/2 -translate-x-1/2 bg-cyan-600 text-white text-xs font-semibold px-5 py-3 rounded-2xl shadow-2xl opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-2 z-50">
        <i class="fa-solid fa-circle-check text-base"></i>
        <span id="toast-msg">Готово!</span>
    </div>

    <script>
        const ADMIN_PIN_EXACT = "126126126";
        let currentRole = 'student';
        let currentUser = localStorage.getItem('logged_user_name') || null;
        let modelsLoaded = false;
        let classmates = JSON.parse(localStorage.getItem('tis_classmates_descriptors') || '[]');

        window.onload = async function() {
            if (currentUser) {
                document.getElementById('user-display-name').innerText = currentUser;
            }
            loadFaceModels();
            renderClassmates();
        };

        // Загрузка моделей нейросети face-api.js
        async function loadFaceModels() {
            try {
                const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                modelsLoaded = true;
                console.log("Нейросеть Face-API успешно загружена");
            } catch (err) {
                console.error("Ошибка загрузки моделей лица:", err);
            }
        }

        async function openFaceAuthModal() {
            document.getElementById('face-modal').classList.remove('hidden');
            const video = document.getElementById('webcam-video');
            const statusText = document.getElementById('face-status-text');
            const scanBtn = document.getElementById('scan-btn');

            if (!modelsLoaded) {
                statusText.innerText = "Загрузка нейросети, подождите...";
                await loadFaceModels();
            }

            statusText.innerText = "Включение камеры...";
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                statusText.innerText = "Посмотрите в камеру и нажмите 'Распознать'";
                scanBtn.disabled = false;
                scanBtn.classList.remove('opacity-50');
            } catch (err) {
                statusText.innerText = "Ошибка доступа к камере!";
            }
        }

        function closeFaceAuthModal() {
            const video = document.getElementById('webcam-video');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            document.getElementById('face-modal').classList.add('hidden');
        }

        // Сканирование лица с камеры и сравнение с базой
        async function scanFaceNow() {
            const video = document.getElementById('webcam-video');
            const statusText = document.getElementById('face-status-text');

            statusText.innerText = "Сканирование...";

            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

            if (!detection) {
                statusText.innerText = "Лицо не найдено! Направьте камеру прямо на лицо.";
                return;
            }

            if (classmates.length === 0) {
                statusText.innerText = "База лиц пуста! Админ должен добавить фото одногруппников.";
                return;
            }

            // Создаем распознаватель из сохраненных дескрипторов
            const labeledDescriptors = classmates.map(c => {
                const floatArray = new Float32Array(c.descriptor);
                return new faceapi.LabeledFaceDescriptors(c.name, [floatArray]);
            });

            const faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
            const bestMatch = faceMatcher.findBestMatch(detection.descriptor);

            if (bestMatch.label !== 'unknown') {
                currentUser = bestMatch.label;
                localStorage.setItem('logged_user_name', currentUser);
                document.getElementById('user-display-name').innerText = currentUser;
                showToast(`Добро пожаловать, ${currentUser}!`);
                closeFaceAuthModal();
            } else {
                statusText.innerText = "Чужое лицо! Доступ запрещен.";
            }
        }

        // Добавление одногруппника с извлечением математического снимка лица
        async function saveClassmate() {
            const name = document.getElementById('cm-name-input').value.trim();
            const photoInput = document.getElementById('cm-photo-input');

            if (!name || !photoInput.files[0]) return alert("Укажите имя и прикрепите фото!");

            showToast("Анализ лица нейросетью...");

            const img = await faceapi.bufferToImage(photoInput.files[0]);
            const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();

            if (!detection) {
                alert("Нейросеть не смогла разглядеть лицо на фото. Загрузите более четкое фото!");
                return;
            }

            // Сохраняем не только фото, но и векторы лица (descriptor)
            const descriptorArray = Array.from(detection.descriptor);

            const reader = new FileReader();
            reader.onload = function(e) {
                classmates.push({
                    id: Date.now(),
                    name: name,
                    photo: e.target.result,
                    descriptor: descriptorArray
                });
                localStorage.setItem('tis_classmates_descriptors', JSON.stringify(classmates));
                closeClassmateModal();
                renderClassmates();
                showToast("Лицо добавлены в базу!");
            };
            reader.readAsDataURL(photoInput.files[0]);
        }

        function renderClassmates() {
            const container = document.getElementById('classmates-container');
            container.innerHTML = '';

            if (classmates.length === 0) {
                container.innerHTML = `<div class="glass-card rounded-2xl p-6 text-center text-xs opacity-60">База лиц пуста. Админ должен добавить одногруппников с фото.</div>`;
                return;
            }

            classmates.forEach(c => {
                const card = document.createElement('div');
                card.className = "glass-card rounded-2xl p-3 flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${c.photo}" class="w-12 h-12 rounded-2xl object-cover border border-cyan-500/30">
                        <div>
                            <h4 class="text-xs font-bold">${c.name}</h4>
                            <span class="text-[9px] text-emerald-400 bg-emerald-950/40 px-2 py-0.5 rounded-md border border-emerald-500/30">Face ID привязан</span>
                        </div>
                    </div>
                    ${currentRole === 'admin' ? `
                        <button onclick="deleteClassmate(${c.id})" class="bg-red-600/30 text-red-300 border border-red-500/30 px-2.5 py-1.5 rounded-xl text-xs"><i class="fa-solid fa-trash"></i></button>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }

        function deleteClassmate(id) {
            classmates = classmates.filter(c => c.id !== id);
            localStorage.setItem('tis_classmates_descriptors', JSON.stringify(classmates));
            renderClassmates();
        }

        function openRoleModal() { document.getElementById('role-modal').classList.remove('hidden'); }
        function closeRoleModal() { document.getElementById('role-modal').classList.add('hidden'); }
        function openAddClassmateModal() { document.getElementById('classmate-modal').classList.remove('hidden'); }
        function closeClassmateModal() { document.getElementById('classmate-modal').classList.add('hidden'); }

        function selectRole(role) {
            currentRole = role;
            document.getElementById('role-badge').innerText = role === 'admin' ? "Разработчик" : "Студент";
            document.getElementById('add-classmate-btn').classList.toggle('hidden', role !== 'admin');
            closeRoleModal();
            renderClassmates();
        }

        function promptRolePin(role) {
            const pin = prompt("Введите PIN-код админа:");
            if (pin === ADMIN_PIN_EXACT) selectRole('admin');
            else alert("Неверный PIN!");
        }

        function switchTab(tab) {
            document.getElementById('section-schedule').classList.toggle('hidden', tab !== 'schedule');
            document.getElementById('section-classmates').classList.toggle('hidden', tab !== 'classmates');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2500);
        }
    </script>
</body>
</html>
